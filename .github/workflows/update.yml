name: Real Mattei daily refresh
on:
  schedule:
    - cron: '0 22,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'update.py'
      - 'docs/index.html'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: real-mattei
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.clock.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determine midnight in Rome
        id: clock
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != schedule ] || [ "$(TZ=Europe/Rome date +%H)" = "00" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.clock.outputs.run == 'true'
        run: pip install requests beautifulsoup4 numpy scipy
      - if: steps.clock.outputs.run == 'true'
        run: python update.py
      - if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name prediction-bot
          git config user.email prediction-bot@users.noreply.github.com
          git add docs/data.json
          git diff --cached --quiet || (git commit -m 'Refresh predictions' && git push)
      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.clock.outputs.run == 'true'
        with:
          path: docs
  deploy:
    needs: refresh
    if: always() && !cancelled() && needs.refresh.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
