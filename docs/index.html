function ticketData(){let p=picks(),q=p.reduce((a,b)=>a*b.q,1);return {p,q,credits:playCredits,score:playCredits*q}}
function marketButtons(g,group){return '<small>'+esc(group.name)+'</small><div class="picks">'+group.items.map(m=>'<button class="pick '+(playSelections[playKey(g)]===m.label?'chosen':'')+'" data-key="'+esc(playKey(g))+'" data-pick="'+esc(m.label)+'" '+(m.q===null?'disabled':'')+' aria-pressed="'+(playSelections[playKey(g)]===m.label)+'"><b>'+esc(m.label)+'</b><br>'+num(m.q,2)+'<br><small>'+pct(m.p)+'</small></button>').join('')+'</div>'}
function playMatch(g){let title='<article><small>GIORNATA '+g.round+'</small><h3>'+team(g.home)+' – '+team(g.away)+'</h3>';if(g.score)return title+'<p>Conclusa: '+g.score.join('–')+' · Non selezionabile</p></article>';if(!g.prob)return title+'<p>Pronostico non disponibile</p></article>';let groups=markets(g);return title+groups.slice(0,2).map(x=>marketButtons(g,x)).join('')+(groups.length>2?'<details '+(playSelections[playKey(g)]?.startsWith('Over')||playSelections[playKey(g)]?.startsWith('Under')?'open':'')+'><summary>Over / Under · 10 soglie</summary>'+groups.slice(2).map(x=>marketButtons(g,x)).join('')+'</details>':'')+'</article>'}
function playPage(){let gs=playGames();return '<div id="playcontrols"><div class="tag gold">FAN ZONE · SOLO PER DIVERTIMENTO</div>'+heading('Mattei Pronostici Club','Sfida gli amici con una schedina di pronostici, senza denaro reale.')+'<p class="virtualnotice">Crediti immaginari, nessun acquisto, deposito, vincita in denaro o premio di valore. Moltiplicatori teorici ricavati dal modello, non quote di un bookmaker. Gli esiti non sono garantiti.</p><div class="toolbar"><label>Giornata <select id="playround">'+[...new Set((D.games||future()).map(g=>g.round))].sort((a,b)=>a-b).map(r=>'<option '+(r===(playRound??D.round)?'selected':'')+'>'+r+'</option>').join('')+'</select></label><button id="clearplay">Azzera selezioni</button></div><div class="gamegrid">'+gs.map(playMatch).join('')+'</div><article><div class="toolbar"><label>Nome o soprannome <input id="playname" maxlength="60" placeholder="Il tuo nome" value="'+esc(playName)+'"></label><label>Crediti virtuali <input id="playcredits" type="number" min="1" max="1000000" step="1" value="'+playCredits+'"></label></div><small>Tutte le gare del turno, inclusi anticipi e posticipi. Una sola scelta per gara tra esito, doppia chance e totale gol. Moltiplicatori teorici senza margine; probabilità arrotondate, non quote commerciali. Il prodotto assume indipendenza tra partite.</small></article></div><div id="ticket"></div><div id="ticketactions" class="toolbar"><button id="exportticket">Esporta schedina PNG</button><button id="printticket">Stampa / salva PDF</button></div>'}
function renderTicket(){let {p,q,credits,score}=ticketData();document.querySelector('#ticket').innerHTML='<div class="ticket"><h3>★ MATTEI PRONOSTICI CLUB</h3><small class="muted">SCHEDINA VIRTUALE · GIORNATA '+esc(playRound??D.round)+'</small><p><b>'+esc(playName.trim()||'Giocatore')+'</b></p>'+(p.length?table(['Partita','Esito','Moltiplicatore'],p.map(({g,label,q})=>[esc(g.home)+' – '+esc(g.away),esc(label),num(q,2)])):'<p>Seleziona almeno una partita.</p>')+'<p>Crediti virtuali: <b>'+esc(credits)+'</b> · Moltiplicatore totale: <b>'+num(q,2)+'×</b></p><div class="big">'+(p.length?num(score,2):'—')+'</div><div>Punteggio virtuale teorico se tutti i pronostici sono corretti</div><small class="muted">Dati modello: '+esc(D.updated?new Date(D.updated).toLocaleString('it-IT',{timeZone:'Europe/Rome'}):'n.d.')+' · Nessun valore monetario. Progetto non ufficiale.</small></div>';for(let id of ['exportticket','printticket'])document.getElementById(id).disabled=!p.length}
function exportTicket(){let {p,q,credits,score}=ticketData();if(!p.length)return;let cv=document.createElement('canvas');cv.width=1080;cv.height=600+p.length*110;let ctx=cv.getContext('2d');ctx.fillStyle='#fff6dd';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#39254f';ctx.fillRect(0,0,1080,180);ctx.fillStyle='#f8ce70';ctx.font='bold 43px system-ui';ctx.fillText('MATTEI PRONOSTICI CLUB',50,75,980);ctx.font='28px system-ui';ctx.fillText('SCHEDINA VIRTUALE · GIORNATA '+(playRound??D.round),50,125,980);ctx.fillStyle='#39254f';ctx.font='bold 38px system-ui';ctx.fillText(playName.trim()||'Giocatore',50,238,980);let y=300;for(let {g,label,q} of p){ctx.font='bold 30px system-ui';ctx.fillText(g.home+' – '+g.away,50,y,980);ctx.font='28px system-ui';ctx.fillText('Pronostico '+label+'     Moltiplicatore '+num(q,2),50,y+40,980);ctx.fillStyle='#d9c9ae';ctx.fillRect(50,y+60,980,2);ctx.fillStyle='#39254f';y+=110}ctx.font='30px system-ui';ctx.fillText('Crediti virtuali: '+credits+'   •   Totale: '+num(q,2)+'×',50,y+12,980);ctx.font='bold 55px system-ui';ctx.fillText(num(score,2)+' punti virtuali',50,y+85,980);ctx.font='25px system-ui';ctx.fillText('Solo se tutti gli esiti sono corretti. Nessun valore monetario.',50,y+135,980);ctx.font='22px system-ui';ctx.fillText('Dati: '+(D.updated?new Date(D.updated).toLocaleString('it-IT',{timeZone:'Europe/Rome'}):'n.d.')+' · Progetto non ufficiale',50,y+180,980);cv.toBlob(blob=>{if(!blob)return;let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mattei-schedina-g'+(playRound??D.round)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')}
function bindPlay(){document.getElementById('playround').onchange=e=>{playRound=+e.target.value;render()};document.getElementById('clearplay').onclick=()=>{playSelections={};render()};document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{let k=b.dataset.key,i=b.dataset.pick;if(playSelections[k]===i)delete playSelections[k];else playSelections[k]=i;render()});document.getElementById('playname').oninput=e=>{playName=e.target.value;renderTicket()};document.getElementById('playcredits').oninput=e=>{playCredits=Math.min(1000000,Math.max(1,Math.round(+e.target.value||1)));renderTicket()};document.getElementById('exportticket').onclick=exportTicket;document.getElementById('printticket').onclick=()=>window.print();renderTicket()}

function render(){if(!D)return;let id=location.hash.slice(1)||'home';document.body.classList.toggle('play',id==='play');document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+id));let g=next(),r=row(RM),html='',t=selectedTeam;switch(id){
case 'play':html=playPage();break;
case 'home':html=heading('Il campionato in numeri','La situazione del Real Mattei e il prossimo incontro.')+'<div class="grid">'+[['Posizione',D.table.indexOf(r)+1+'ª'],['Punti',r.points],['Gol fatti',r.gf],['Gol subiti',r.ga],['Titolo',pct(r.title)],['Punti finali attesi',num(r.projected)]].map(([k,v])=>'<article><small>'+k+'</small><div class="big">'+v+'</div></article>').join('')+'</div>'+(g?game(g):'')+'<p><a href="#next">Apri analisi completa del prossimo match →</a></p>'+standings();break;
case 'next':html=heading('Prossimo match · Real Mattei','Analisi esclusiva della prossima partita disponibile.')+(g?game(g,true)+table(['Confronto',g.home,g.away],['points','gf','ga','attack','defense'].map((k,i)=>[['Punti','Gol fatti','Gol subiti','Rating attacco','Rating difesa'][i],esc(row(g.home)[k]),esc(row(g.away)[k])])):'Nessuna partita residua disponibile.')+notice('Marcatori avversari: dati individuali non ancora verificati. Nessuna deduzione su assenze o qualità dei giocatori.');break;
case 'calendar':html=heading('Calendario e risultati','Tutte le gare del Real Mattei per giornata.')+table(['Giornata','Partita','Risultato'],(D.games||[]).filter(g=>[g.home,g.away].includes(RM)).map(g=>[g.round,team(g.home)+' – '+team(g.away),g.score?g.score.join('–'):'Da giocare']));break;
case 'matches':html=heading('Pronostici di giornata','Risultati attesi, probabilità 1/X/2 e commenti per entrambe le squadre.')+choice()+currentGames().map(g=>game(g)).join('');break;
case 'over':html=heading('Over & Under','Probabilità sul totale gol e sulle singole squadre.')+overPage();break;
case 'table':html=heading('Classifica e forma','Classifica ricostruita dai risultati. Eventuali penalizzazioni non incluse.')+standings();break;
case 'power':html=heading('Power Ranking','Rating stimati al netto della forza degli avversari. Valori più alti indicano maggiore forza.')+table(['Squadra','Attacco','Difesa'],[...D.table].sort((a,b)=>b.attack+b.defense-a.attack-a.defense).map(t=>[team(t.team),esc(t.attack),esc(t.defense)]));break;
case 'future':html=heading('Previsioni campionato','20.000 simulazioni; spareggio semplificato per differenza reti.')+season();break;
case 'teams':html=heading('Schede squadre','Profilo statistico, strisce, rendimento e risultati.')+'<select id="teamSelect">'+D.table.map(x=>'<option '+(x.team===t?'selected':'')+'>'+esc(x.team)+'</option>').join('')+'</select><article>'+strengths(t)+table(['Rendimento','G','Pt','GF','GS'],['home','away','all'].map(v=>{let s=stats(matchesFor(t,v));return [{home:'Casa',away:'Trasferta',all:'Totale'}[v],s.n,s.points,s.gf,s.ga]}))+table(['Giornata','Avversario','Campo','Risultato'],matchesFor(t).map(x=>[x.round,team(x.op),x.home?'Casa':'Trasferta',x.gf+'–'+x.ga]))+'</article>';break;
case 'whatif':html=heading('Simulatore What-if','Scenari sul Real Mattei e conseguenze per tutto il girone.')+scenarioPage();break;
case 'scorers':html=heading('Classifica marcatori','Pericolosità individuale misurata esclusivamente dai gol.')+notice('Nessuna classifica completa verificata per questo girone. Gli assist e le presenze non vengono stimati; dato mancante non equivale a zero.')+'<p>Fonti da consultare: <a href="https://www.calcioa5live.com/">Calcio a 5 Live</a> · <a href="https://www.tuttocampo.it/">Tuttocampo</a>.</p>';break;
case 'discipline':html=heading('Giustizia sportiva','Squalifiche e provvedimenti ufficiali.')+notice('Nessun flusso disciplinare automatico verificato. Non è possibile dedurre che tutti i giocatori siano disponibili.')+'<p><a href="https://lazio.lnd.it/comunicati/">Comunicati ufficiali LND Lazio</a></p>';break;
case 'history':let h=D.history||[],ok=h.filter(g=>Math.sign(g.prediction[0]-g.prediction[1])===Math.sign(g.actual[0]-g.actual[1])).length,exact=h.filter(g=>g.prediction.join()===g.actual.join()).length;html=heading('Storico e accuratezza','Pronostici archiviati prima della gara e confronto con i risultati.')+'<div class="grid">'+[['Gare valutate',h.length],['Esiti corretti',h.length?pct(100*ok/h.length):'—'],['Risultati esatti',exact]].map(([k,v])=>'<article><small>'+k+'</small><div class="big">'+v+'</div></article>').join('')+'</div>'+table(['Partita','Previsto','Reale'],h.map(g=>[team(g.home)+' – '+team(g.away),g.prediction.join('–'),g.actual.join('–')]));break;
default:html=heading('Fonti e qualità dei dati','Trasparenza del modello.')+'<article><p>Risultati: <a href="https://www.calcioa5live.com/?annoRiferimento=2026%2F2027&com=girone&id=21">Calcio a 5 Live</a>. '+D.played+' gare elaborate. Il calendario viene verificato per completezza prima di sostituire i dati.</p><p>Poisson regolarizzato, rating attacco/difesa, fattore campo e peso temporale 0,85 per giornata. Gol attesi arrotondati nel pronostico; probabilità non calibrate su più stagioni. Simulazioni con rating fissi, spareggio per differenza reti, penalizzazioni non incluse.</p><p>Tuttocampo e LND sono fonti complementari non ancora integrate automaticamente. Marcatori e squalifiche non verificati.</p></article>'}
document.querySelector('#app').innerHTML=(D.demo?notice('Dati dimostrativi.'):'')+(!D.games?notice('In attesa del primo refresh con lo schema 2.0: storico dettagliato non ancora disponibile.'):'')+html;
for(let [id,cb] of [['round',e=>roundChoice=+e.target.value],['threshold',e=>threshold=+e.target.value],['split',e=>split=e.target.value],['teamSelect',e=>selectedTeam=e.target.value]]){let el=document.getElementById(id);if(el)el.onchange=e=>{cb(e);render()}}
document.querySelectorAll('.force,.goal').forEach(el=>el.onchange=()=>{let i=+el.dataset.i,opts=future().filter(g=>g.expected&&[g.home,g.away].includes(RM)).slice(0,6);scenario[i]??={on:false,a:opts[i].prediction[0],b:opts[i].prediction[1]};if(el.classList.contains('force'))scenario[i].on=el.checked;else scenario[i][el.dataset.side==='0'?'a':'b']=Math.min(40,Math.max(0,Math.round(Number(el.value)||0)))});if(document.querySelector('#simulate'))document.querySelector('#simulate').onclick=sim;if(id==='play')bindPlay()}
async function load(){try{let r=await fetch('data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();D=await r.json();document.querySelector('#refresh').textContent='Ultimo aggiornamento riuscito: '+(D.updated?new Intl.DateTimeFormat('it-IT',{dateStyle:'short',timeStyle:'short',timeZone:'Europe/Rome'}).format(new Date(D.updated)):'non ancora eseguito');render()}catch(e){if(!D)document.querySelector('#app').textContent='Dati non disponibili. Riprova.';console.error(e)}}
window.onhashchange=()=>{document.querySelector('#nav').classList.remove('open');document.querySelector('#toggle').setAttribute('aria-expanded','false');render();window.scrollTo(0,0)};document.querySelector('#toggle').onclick=()=>{let b=document.querySelector('#nav').classList.toggle('open');document.querySelector('#toggle').setAttribute('aria-expanded',b)};document.querySelector('#share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else{await navigator.clipboard.writeText(location.href);document.querySelector('#share').textContent='Link copiato'}}catch(e){}};load();setInterval(load,300000);
</script></html>
